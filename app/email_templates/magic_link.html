<!DOCTYPE html>
<html lang="en">
  <body style="font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background:#f4f6f8; margin:0; padding:24px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; margin:0 auto; background:#ffffff; border-radius:12px; overflow:hidden;">
      <tr>
        <td style="padding:32px 32px 8px;">
          <h2 style="margin:0 0 4px; color:#0f5132;">MasjidKoi</h2>
          <p style="margin:0; color:#444; font-size:15px;">Your login code</p>
        </td>
      </tr>
      <tr>
        <td style="padding:16px 32px;">
          <div style="font-size:38px; font-weight:700; letter-spacing:10px; text-align:center; color:#111; background:#f4f6f8; border-radius:10px; padding:18px 0;">
            {{ .Token }}
          </div>
        </td>
      </tr>
      <tr>
        <td style="padding:8px 32px 32px; color:#666; font-size:13px; line-height:1.5;">
          <p style="margin:0 0 8px;">Enter this code in the app to sign in. It expires in <strong>10 minutes</strong>.</p>
          <p style="margin:0;">If you didn't request this, you can safely ignore this email.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
