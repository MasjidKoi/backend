# ─────────────────────────────────────────────────────────────────────────────
# Production stack for the MasjidKoi backend.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Differences from the dev docker-compose.yml:
#   • Runs the hardened runtime image (non-root, no --reload, no source mount).
#   • Nothing internal is published to the host — only Caddy (80/443) is public.
#     Postgres / PgBouncer / GoTrue / MinIO / Redis stay on the private network.
#   • TLS + routing handled by Caddy (automatic Let's Encrypt) — see Caddyfile.
#   • All credentials come from .env.production; no hardcoded minioadmin/passwords.
#   • A one-shot `migrate` service runs Alembic before the API starts.
#   • MinIO photo/avatar buckets get an anonymous-download policy so client URLs
#     (built from S3_PUBLIC_URL) resolve; the imports bucket stays private.
#
# NOTE: POSTGRES_USER must remain "masjidkoi" — scripts/init-db.sql grants the
# auth schema to that role literally. Harden POSTGRES_PASSWORD, not the username.
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

services:
  # ── Reverse proxy / TLS termination ─────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: masjidkoi_caddy
    <<: [*default-restart]
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      API_DOMAIN: ${API_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
      CDN_DOMAIN: ${CDN_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      gotrue:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Database ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: masjidkoi_postgres
    <<: [*default-restart]
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-masjidkoi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-masjidkoi}
      POSTGRES_HOST_AUTH_METHOD: md5   # pgbouncer stores md5 hashes; scram-sha-256 requires plaintext
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-masjidkoi} -d ${POSTGRES_DB:-masjidkoi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: masjidkoi_pgbouncer
    <<: [*default-restart]
    logging: *default-logging
    environment:
      DB_USER: ${POSTGRES_USER:-masjidkoi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-masjidkoi}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 20
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      AUTH_TYPE: plain     # plain keeps password in plaintext so pgbouncer can do SCRAM to postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-masjidkoi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Alembic migrations (one-shot, runs to completion then exits) ─────────────
  # Connects DIRECTLY to postgres (not pgbouncer) — alembic uses prepared
  # statements that pgbouncer transaction mode cannot route.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: masjidkoi-migrate:latest
    container_name: masjidkoi_migrate
    restart: "no"
    logging: *default-logging
    environment:
      # env.py reads settings.DATABASE_URL and swaps asyncpg → psycopg2.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-masjidkoi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-masjidkoi}
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
      GOTRUE_SERVICE_ROLE_KEY: ${GOTRUE_SERVICE_ROLE_KEY}
    depends_on:
      postgres:
        condition: service_healthy

  # ── Auth server ──────────────────────────────────────────────────────────────
  gotrue:
    image: ghcr.io/supabase/gotrue:v2.151.0
    container_name: masjidkoi_gotrue
    <<: [*default-restart]
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:?GOTRUE_JWT_SECRET is required}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role

      GOTRUE_DB_DRIVER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-masjidkoi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-masjidkoi}
      DB_NAMESPACE: auth

      GOTRUE_API_HOST: "0.0.0.0"
      PORT: 9999
      # Public HTTPS URL of GoTrue (used in invite / password-reset email links).
      API_EXTERNAL_URL: https://${AUTH_DOMAIN}
      GOTRUE_SITE_URL: ${FRONTEND_URL}

      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"

      # Production: real SMTP, no auto-confirm.
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_OTP_EXP: 600
      GOTRUE_MAILER_OTP_LENGTH: 6
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_FROM}
      GOTRUE_SMTP_SENDER_NAME: MasjidKoi

      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "আপনার MasjidKoi লগইন কোড"
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://api:8000/email-templates/magic_link.html

      GOTRUE_MAILER_URLPATHS_INVITE: /verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /verify
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST}

      GOTRUE_MFA_ENABLED: "true"
      GOTRUE_MFA_TOTP_ENROLLMENT_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFICATION_PERIOD: 30
      GOTRUE_MFA_TOTP_ISSUER: MasjidKoi

      GOTRUE_PASSWORD_MIN_LENGTH: 8

      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9999/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Object storage ───────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: masjidkoi_minio
    <<: [*default-restart]
    logging: *default-logging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      # Public host clients use for object URLs — fixes presigned-URL signatures.
      MINIO_SERVER_URL: https://${CDN_DOMAIN}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    # Console bound to loopback only — reach it via SSH tunnel, never public.
    ports:
      - "127.0.0.1:9091:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: masjidkoi_minio_init
    restart: "no"
    logging: *default-logging
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/masjidkoi-imports &&
      mc mb --ignore-existing local/masjidkoi-photos &&
      mc mb --ignore-existing local/masjidkoi-avatars &&
      mc anonymous set download local/masjidkoi-photos &&
      mc anonymous set download local/masjidkoi-avatars &&
      echo 'Buckets ready (photos/avatars public-read, imports private).'
      "

  # ── Cache / rate-limit / scheduler locks ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: masjidkoi_redis
    <<: [*default-restart]
    logging: *default-logging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ── API ──────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: masjidkoi-api:latest
    container_name: masjidkoi_api
    <<: [*default-restart]
    logging: *default-logging
    env_file:
      - .env.production
    # No command override / no source mount — runs the image's hardened CMD
    # (non-root uvicorn, single worker so the APScheduler runs exactly once).
    expose:
      - "8000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      gotrue:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Python one-liner (no curl/wget in the slim runtime image); urlopen raises
      # on non-200 / connection-refused so the check fails until uvicorn is
      # serving and lifespan startup (Redis pool, scheduler) has completed. Lets
      # caddy/frontend gate on service_healthy instead of mere start-order.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Web admin panel ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_APP_ENV: production
    image: masjidkoi-frontend:latest
    container_name: masjidkoi_frontend
    <<: [*default-restart]
    logging: *default-logging
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  minio-data:
  redis-data:
  caddy_data:
  caddy_config:
